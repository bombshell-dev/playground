[workspace]
members = [
	"crates/css-core",
	"crates/css-compiler",
	"crates/css-runtime",
	"crates/css-wasm",
	"crates/css-conformance",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/natemoo-re/css"
rust-version = "1.85"

[workspace.dependencies]
bombshell-css-core = { path = "crates/css-core" }
bombshell-css-compiler = { path = "crates/css-compiler" }
bombshell-css-runtime = { path = "crates/css-runtime" }
cc = "1"
cssparser = "0.37.0"
parcel_selectors = "0.28.3"
rustc-hash = "2"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
wit-bindgen = { version = "0.62.0", default-features = false, features = [
	"macros",
	"realloc",
	"bitflags",
] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"
strip = true
