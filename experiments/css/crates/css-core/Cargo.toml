[package]
name = "bombshell-css-core"
version = "0.1.0"
description = "Shared contracts, typed CSS IR, and codec for the Bombshell CSS pipeline"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["selectors"]
selectors = ["dep:parcel_selectors", "dep:cssparser"]

[dependencies]
serde = { workspace = true }
postcard = { workspace = true }
cssparser = { workspace = true, optional = true }
parcel_selectors = { workspace = true, optional = true }
